# Deploys the MyST site in ./COMP_1110 to GitHub Pages.
# See https://mystmd.org/guide/deployment-github-pages

name: MyST GitHub Pages Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Site is served from https://tru-cs.github.io/COMP_1110/
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # The MyST project lives in a subdirectory of the repo.
        working-directory: COMP_1110
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build HTML Assets
        run: myst build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './COMP_1110/_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
