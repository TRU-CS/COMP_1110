# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: comp-1110-fall-2026
  title: COMP 1110 - Introduction to Computer Programming
  description: >-
    A first course in computer programming using Python. Course outline and weekly
    lecture notes for Fall 2026 at Thompson Rivers University.
  keywords:
    - Python
    - introductory programming
    - COMP 1110
    - computer science education
  authors:
    - name: Quan Nguyen
      affiliations:
        - Thompson Rivers University
      email: lnguyen@tru.ca
  open_access: true
  license: CC-BY-4.0
  # In-page execution. Readers press the power button at the top of a lecture page
  # to start a Pyodide kernel in their own browser, then run any code cell on the
  # page. No install, no account, no server.
  #
  # This is project-level, so EVERY page in the toc below inherits it — a new week
  # needs nothing beyond being uncommented. Do not set `thebe`/`jupyter` in an
  # individual notebook; that would override this.
  #
  # Cells are run-only: MyST has no editable-cell option (its thebe frontmatter
  # accepts only lite/binder/server/kernelName/sessionName/disableSessionSaving/
  # mathjax*), and editable thebe cells are still an open upstream request. If
  # students need to edit and keep their changes, that needs a JupyterLite build.
  jupyter:
    lite: true
  # Notebooks are committed with their outputs already stored, so the site builds
  # without a kernel. Re-execute a notebook after editing any code cell (see README).
  # Flat TOC: syllabus.md is first, so it is the landing page.
  # Only the syllabus is published for now; uncomment weeks as they are released.
  toc:
    - file: syllabus.md
    - file: notebooks/week01_intro.ipynb
    # - file: notebooks/week02_variables.ipynb
    # - file: notebooks/week03_conditionals.ipynb
    # - file: notebooks/week04_functions.ipynb
    # - file: notebooks/week05_iteration.ipynb
    # - file: notebooks/week06_git_and_project.ipynb
    # - file: notebooks/week06_midterm1_review.ipynb
    # - file: notebooks/week07_strings.ipynb
    # - file: notebooks/week08_files_testing_docs.ipynb
    # - file: notebooks/week09_lists.ipynb
    # - file: notebooks/week10_dictionaries.ipynb
    # - file: notebooks/week11_tuples_sets_review.ipynb
    # - file: notebooks/week12_oop.ipynb
    # - file: notebooks/week13_style_and_polish.ipynb
site:
  template: book-theme
  title: COMP 1110 - Fall 2026
  options:
    logo: img/logo2.png
    favicon: img/logo2.png
    hide_toc: false
